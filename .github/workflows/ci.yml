name: CI Proyecto A+S

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Calidad de código (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Revisar estilo y errores
        run: ruff check src tests

      - name: Revisar formato
        run: ruff format --check src tests

  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar pruebas automatizadas
        run: |
          mkdir -p reports
          pytest \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --cov --cov-report=term-missing --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-fail-under=90 | tee reports/pytest-${{ matrix.python-version }}.txt

      - name: Publicar resumen
        if: always()
        run: |
          {
            echo "### Pruebas en Python ${{ matrix.python-version }}"
            echo '```'
            tail -n 25 reports/pytest-${{ matrix.python-version }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-python-${{ matrix.python-version }}
          path: reports/

  build:
    name: Construcción (paquete e imagen Docker)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Construir paquete (wheel y sdist)
        run: |
          pip install build
          python -m build

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: paquete-ruta-as-core
          path: dist/

      - name: Construir imagen Docker
        run: docker build -t ruta-as-core:${{ github.sha }} .

      - name: Prueba de humo de la imagen
        run: |
          docker run --rm ruta-as-core:${{ github.sha }} | tee salida.json
          python -c "import json; d = json.load(open('salida.json')); assert d['avance_porcentaje'] == 50.0, d"
          {
            echo "### Prueba de humo de la imagen Docker"
            echo '```json'
            cat salida.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ruta-as-core"
version = "1.0.0"
description = "Componente mínimo del Proyecto A+S: cálculo del avance de la Ruta A+S por sección."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Nicolás Bascuñán" },
  { name = "Sofía Díaz" },
  { name = "José Moris" },
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ruta-as-avance = "ruta_as_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["unit: pruebas unitarias de lógica de negocio aislada (sin I/O ni red)"]

[tool.coverage.run]
source = ["ruta_as_core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

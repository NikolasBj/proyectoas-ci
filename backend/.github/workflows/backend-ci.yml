name: CI Backend A+S

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

# Configuración solo para CI: base de datos efímera y credenciales ficticias.
# No se usan secretos ni servicios de producción (Neon, Supabase, Render).
env:
  SECRET_KEY: clave-solo-para-ci
  DEBUG: "True"            # evita la redirección HTTPS de producción durante las pruebas
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DB_NAME: as_ci
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  EMAIL_SIMULADO: "True"

jobs:
  test:
    name: Validación y pruebas (PostGIS efímero)
    runs-on: ubuntu-24.04

    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: as_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar librerías de GeoDjango y WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils gdal-bin libgdal-dev libgeos-dev libproj-dev libpq5 \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b fonts-dejavu-core

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar configuración de Django
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas (unitarias, integración y seguridad)
        run: |
          mkdir -p reports
          pytest tests/ -v \
            --junitxml=reports/junit.xml \
            --cov=authentication --cov=core --cov=documentos \
            --cov=georeferenciacion --cov=notificaciones --cov=ruta_as \
            --cov-report=term --cov-report=xml:reports/coverage.xml \
            | tee reports/pytest.txt

      - name: Publicar resumen
        if: always()
        run: |
          {
            echo "### Resultado de las pruebas del backend"
            echo '```'
            grep -E "passed|failed|error" reports/pytest.txt | tail -n 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: reports/

  build:
    name: Construcción de la imagen Docker
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t backend-as:${{ github.sha }} .

      - name: Prueba de humo de la imagen
        run: |
          docker run --rm -e SECRET_KEY=clave-solo-para-ci -e DEBUG=False \
            backend-as:${{ github.sha }} python manage.py check
          echo "### Imagen Docker construida y verificada con manage.py check" >> "$GITHUB_STEP_SUMMARY"
